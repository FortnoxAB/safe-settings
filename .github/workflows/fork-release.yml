name: Fork release
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.suffix.outputs.tag }}
      image: ${{ steps.suffix.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main-enterprise
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: suffix
        run: |
          SHA=$(git rev-parse --short HEAD)
          TAG="fnx-${SHA}"
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.suffix.outputs.tag }}"
          git push origin "${{ steps.suffix.outputs.tag }}"

  build:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to the container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ needs.tag.outputs.image }}:${{ needs.tag.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

  helm:
    runs-on: ubuntu-latest
    needs: [tag, build]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Publish Helm chart
        run: |
          HELM_REPO=$(echo "oci://ghcr.io/${{ github.repository_owner }}/helm-charts" | tr '[:upper:]' '[:lower:]')
          cd helm
          helm registry login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ghcr.io
          helm package --app-version ${{ needs.tag.outputs.tag }} --version ${{ needs.tag.outputs.tag }} safe-settings
          helm push safe-settings-${{ needs.tag.outputs.tag }}.tgz $HELM_REPO
